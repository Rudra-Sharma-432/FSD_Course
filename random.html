<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
      .name {
        color: blue;
        text-decoration: underline;
        font-weight: bold;
        font-style: italic;
        transition: transform 0.2s ease-in-out;
      }


      .grow {
        display: inline-block;
        transition: transform 0.2s ease-in-out;
      }

      .grow:hover {
        transform: scale(1.1);
      }
    </style>
  </head>

  <body>
    <p>my name is <i>rudra</i>.</p>
    <p>my name is <u>rudra</u>.</p>
    <p>my name is <strong>rudra</strong>.</p>

    <p>my name is <i><u><strong style="color: blue;">Rudra</strong></u></i>.</p>

    <p class="grow">my name is <span class="name">Rudra</span>.</p>


    <br><br>
    <span>hello</span><span>hi</span>
    <span>hello</span> <span>hi</span>

  </body>

</html>
